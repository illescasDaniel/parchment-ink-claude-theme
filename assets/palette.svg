<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="13">
  <title id="t">Parchment &amp; Ink palette</title>
  <desc id="d">Two rows of colour swatches. Light mode: page f4ecd8, card f8f2e2, panel fcf8ec, text 15120d, accent 17696a. Dark mode: page 0d0c0b, card 161514, panel 1e1d1b, text f7f4ec, accent 4fc1bd.</desc>
  <text x="10" y="22" font-weight="bold">Light</text>
  <g stroke="#8884" stroke-width="1">
    <rect x="10" y="30" width="116" height="64" rx="8" fill="#f4ecd8"/><rect x="136" y="30" width="116" height="64" rx="8" fill="#f8f2e2"/>
    <rect x="262" y="30" width="116" height="64" rx="8" fill="#fcf8ec"/><rect x="388" y="30" width="116" height="64" rx="8" fill="#15120d"/>
    <rect x="514" y="30" width="116" height="64" rx="8" fill="#17696a"/>
  </g>
  <text x="10" y="112" fill="#444">page #f4ecd8</text><text x="136" y="112" fill="#444">card #f8f2e2</text><text x="262" y="112" fill="#444">panel #fcf8ec</text><text x="388" y="112" fill="#444">text #15120d</text><text x="514" y="112" fill="#444">accent #17696a</text>
  <text x="10" y="142" font-weight="bold" fill="#444">Dark</text>
  <g stroke="#8884" stroke-width="1">
    <rect x="10" y="150" width="116" height="40" rx="8" fill="#0d0c0b"/><rect x="136" y="150" width="116" height="40" rx="8" fill="#161514"/>
    <rect x="262" y="150" width="116" height="40" rx="8" fill="#1e1d1b"/><rect x="388" y="150" width="116" height="40" rx="8" fill="#f7f4ec"/>
    <rect x="514" y="150" width="116" height="40" rx="8" fill="#4fc1bd"/>
  </g>
  <text x="10" y="210" fill="#444">page #0d0c0b</text><text x="136" y="210" fill="#444">card #161514</text><text x="262" y="210" fill="#444">panel #1e1d1b</text><text x="388" y="210" fill="#444">text #f7f4ec</text><text x="514" y="210" fill="#444">accent #4fc1bd</text>
</svg>
